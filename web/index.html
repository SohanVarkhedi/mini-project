<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PhishVerse Training</title>
<script>try{var t=localStorage.getItem('pv-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Portal: Atkinson Hyperlegible Next/Mono + Pixelify Sans (docs/UI_GUIDE.md). Game canvas + HUD: Inter. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/portal.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- ================= PORTAL (rendered by js/portal.js) ================= -->
<div id="portal" class="ds"><div id="app"></div></div>

<!-- ================= GAME ================= -->
<div id="game" hidden>
  <canvas id="screen"></canvas>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="hud tl">
    <button class="pill" id="exitBtn" type="button">← Exit level</button>
    <button class="pill round" id="sndBtn" type="button" aria-label="Toggle sound"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="sndWave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
  </div>
  <div class="hud tr">
    <div class="pill"><span class="live-dot"></span><span id="lvlName">Level 1 · Office Orientation</span></div>
    <div class="tracker" id="tracker"><header><b>Objectives</b><span id="tCount">0/4</span><button type="button" id="tToggle" aria-label="Collapse objectives">–</button></header><div class="tlist" id="tList"></div></div>
  </div>
  <canvas id="mini" width="208" height="160" title="Map"></canvas>
  <div class="room" id="room"><small>Now entering</small><span id="roomName">Lobby</span></div>
  <div class="toast" id="toast"><div class="flag" id="toastIcon">✓</div><div><small id="toastKind">Objective complete</small><strong id="toastText">Baiting</strong></div></div>
  <div class="prompt" id="prompt"><kbd>SPACE</kbd><span id="promptVerb">Talk</span></div>
  <div class="joy-zone" id="joyZone" aria-hidden="true" hidden></div>
  <div class="joy" id="joy" aria-hidden="true" hidden><i class="joy-tick" data-d="up"></i><i class="joy-tick" data-d="right"></i><i class="joy-tick" data-d="down"></i><i class="joy-tick" data-d="left"></i><div class="joy-knob" id="joyKnob"></div></div>
  <button class="actbtn" id="tapBtn" type="button" hidden aria-label="Action: nothing in front of you"><span class="actbtn-a" aria-hidden="true">A</span><span class="actbtn-verb" id="actVerb" aria-hidden="true"></span></button>

  <div class="dlg" id="dlg" hidden role="dialog" aria-live="polite">
    <div class="dlg-portrait"><canvas id="dlgPortrait" width="56" height="56"></canvas><span class="ico" id="dlgIcon" hidden></span></div>
    <div class="dlg-name" id="dlgName"></div>
    <div class="dlg-text" id="dlgText"></div>
    <div class="dlg-dots" id="dlgDots"></div>
    <button class="dlg-next" id="dlgNext" type="button">Next ▶</button>
  </div>
  <div class="modal" id="modal" hidden></div>
  <canvas id="confetti"></canvas>
</div>

<div id="ui-layer" class="ds"></div>

<script src="js/core.js"></script>
<script src="js/content-data.js"></script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/touch.js"></script>
<script src="js/ui.js"></script>
<script src="js/live.js"></script>
<script src="js/journey.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
