<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhishVerse Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ================= PORTAL ================= -->
<div id="portal">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg width="18" height="20" viewBox="0 0 46 52" fill="none"><path d="M23 2 42 9v15c0 12-8 21-19 26C12 45 4 36 4 24V9L23 2Z" fill="#fff"/><path d="M14 26.5l6.2 6.2L32.5 20" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>PhishVerse</b><small id="orgName">NovaCorp · Security training</small></div>
    </div>
    <div class="sp"></div>
    <div class="seg" id="demoSeg" hidden><button type="button" data-r="mgr" class="on">Manager</button><button type="button" data-r="emp">Employee</button></div>
    <span class="role" id="roleChip">Manager</span>
    <div class="who"><img id="meAv" alt=""><span class="nm" id="meName">You</span></div>
    <button class="btn ghost sm" id="logoutBtn" type="button" hidden>Sign out</button>
  </header>
  <main class="wrap" id="view"></main>
</div>

<!-- ================= GAME ================= -->
<div id="game" hidden>
  <canvas id="screen"></canvas>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="hud tl">
    <button class="pill" id="exitBtn" type="button">← Exit level</button>
    <button class="pill round" id="sndBtn" type="button" aria-label="Toggle sound"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="sndWave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
  </div>
  <div class="hud tr">
    <div class="pill"><span class="live-dot"></span><span id="lvlName">Level 1 · Office Orientation</span></div>
    <div class="tracker" id="tracker"><header><b>Objectives</b><span id="tCount">0/4</span><button type="button" id="tToggle" aria-label="Collapse objectives">–</button></header><div class="tlist" id="tList"></div></div>
  </div>
  <canvas id="mini" width="208" height="160" title="Map"></canvas>
  <div class="room" id="room"><small>Now entering</small><span id="roomName">Lobby</span></div>
  <div class="toast" id="toast"><div class="flag" id="toastIcon">✓</div><div><small id="toastKind">Objective complete</small><strong id="toastText">Baiting</strong></div></div>
  <div class="prompt" id="prompt"><kbd>SPACE</kbd><span id="promptVerb">Talk</span></div>
  <button class="tapbtn" id="tapBtn" type="button" hidden>TALK</button>

  <div class="dlg" id="dlg" hidden role="dialog" aria-live="polite">
    <div class="dlg-portrait"><canvas id="dlgPortrait" width="56" height="56"></canvas><span class="ico" id="dlgIcon" hidden></span></div>
    <div class="dlg-name" id="dlgName"></div>
    <div class="dlg-text" id="dlgText"></div>
    <div class="dlg-dots" id="dlgDots"></div>
    <button class="dlg-next" id="dlgNext" type="button">Next ▶</button>
  </div>
  <div class="modal" id="modal" hidden></div>
  <canvas id="confetti"></canvas>
</div>

<script src="js/core.js"></script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
